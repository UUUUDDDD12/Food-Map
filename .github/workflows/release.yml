name: Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - package.json
      - .github/workflows/release.yml
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:windows
      - uses: actions/upload-artifact@v4
        with:
          name: tasty-windows-x64
          path: |
            release/*.zip
            release/*.sha256
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          if ("${{ github.ref_type }}" -eq 'tag' -and "${{ github.ref_name }}" -ne $tag) {
            throw 'Tag must match package.json version'
          }
          gh release view $tag --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "$tag already exists; download the rebuilt files from this workflow artifact."
          } else {
            gh release create $tag release/*.zip release/*.sha256 --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "食遇 $tag" --notes-file RELEASE_NOTES.md
          }
